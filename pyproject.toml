[project]
name = "bezvyfuku"
version = "0.1.0"
description = "Data pro bezvyfuku.cz z otevrenych dat Registru silnicnich vozidel"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0,<3",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
