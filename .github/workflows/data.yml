# Kazdy mesic: novy vypis RSV -> data pro web a report -> pull request ke kontrole.
# Cloudflare k pull requestu postavi nahled webu, po slouceni jde web ven.
name: Data

on:
  schedule:
    # Vypis vychazi 12. dne v mesici. Kdyz se zpozdi, chytne ho nektery z dalsich dni.
    - cron: "0 6 12-25 * *"
  workflow_dispatch:
    inputs:
      force:
        description: Projit cely beh i bez noveho vypisu (test)
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: data

env:
  PORTAL: https://download.dataovozidlech.cz

jobs:
  data:
    runs-on: ubuntu-latest
    # Runner GitHubu je v USA a ze serveru MD dostal v testu jen ~1 MB/s. Proto se
    # stahuje komprimovany vypis (~4,6 GB misto 17 GB CSV), trva to zhruba 1,5 hodiny.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - name: Je venku novy vypis?
        id: vypis
        env:
          FORCE: ${{ inputs.force }}
        run: |
          # Komprimovany vypis je jen pod GUID, ktere vraci API portalu. API chce
          # kratkodoby token, ktery portal posila v hlavicce _ren odpovedi na /,
          # a Referer z portalu (bez nej odpovida 404).
          ren=$(curl -sSf -D - -o /dev/null "$PORTAL/" | tr -d '\r' | sed -n 's/^_ren: //Ip')
          vypis=$(curl -sSf -H "_ren: $ren" -H "Referer: $PORTAL/" -H 'Accept: application/json' \
            "$PORTAL/api/datareport/regularLatestReports" \
            | jq -r '.[] | select(.NormalizedNazev == "vypisvozidel") | "\(.Guid) \(.Vygenerovano)"')
          read -r guid vygenerovano <<< "$vypis"
          datum=${vygenerovano:0:10}
          if [[ ! "$guid" =~ ^[0-9a-f-]{36}$ || ! "$datum" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::API portalu vratilo neco necekaneho: '$vypis'"
            exit 1
          fi
          na_webu=$(jq -r .snapshot site/src/data/registrace.json)
          echo "Vypis na serveru: $datum, na webu: $na_webu"

          novy=false
          if [[ "$datum" > "$na_webu" ]]; then
            if git ls-remote --exit-code --heads origin "data/$datum" > /dev/null; then
              echo "Vetev data/$datum uz existuje, pull request je otevreny."
            else
              novy=true
            fi
          fi
          if [[ "$FORCE" == "true" ]]; then
            novy=true
          fi
          {
            echo "datum=$datum"
            echo "guid=$guid"
            echo "novy=$novy"
          } >> "$GITHUB_OUTPUT"

      # setup-uv nema plovouci tag v10, jen presne verze
      - uses: astral-sh/setup-uv@v10.3.3
        if: steps.vypis.outputs.novy == 'true'
        with:
          enable-cache: true

      - name: Stazeni a prevod na Parquet
        if: steps.vypis.outputs.novy == 'true'
        env:
          DATUM: ${{ steps.vypis.outputs.datum }}
          GUID: ${{ steps.vypis.outputs.guid }}
        run: |
          uv sync --locked
          # Server neumi navazat prerusene stahovani, --retry stahuje znovu od zacatku.
          curl -sSf --retry 3 --retry-all-errors --speed-limit 10000 --speed-time 300 \
            -D hlavicky.txt -o vypis.zip "$PORTAL/vypiszregistru/$GUID"
          if ! grep -qi "filename=.*_${DATUM//-/}\.zip" hlavicky.txt; then
            echo "::error::Stazeny soubor neni vypis k $DATUM"
            exit 1
          fi
          set -o pipefail
          # CSV se rozbaluje rovnou do DuckDB, 17 GB na disk runneru neukladame.
          unzip -p vypis.zip | uv run python -m pipeline ingest - --date "$DATUM"
          rm vypis.zip

      - name: Data pro web a report
        if: steps.vypis.outputs.novy == 'true'
        run: |
          uv run python -m pipeline export
          uv run python -m pipeline report | tee report.txt
          uv run pytest -q

      - uses: actions/upload-artifact@v7
        if: steps.vypis.outputs.novy == 'true'
        with:
          name: report-${{ steps.vypis.outputs.datum }}
          path: report_*.xlsx

      - name: Pull request
        if: steps.vypis.outputs.novy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DATUM: ${{ steps.vypis.outputs.datum }}
          BEH: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if git diff --quiet -- site/src/data/registrace.json; then
            echo "Data pro web se nezmenila, pull request neni potreba."
            exit 0
          fi
          den=$(date -d "$DATUM" '+%-d. %-m. %Y')
          vetev="data/$DATUM"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$vetev"
          git add site/src/data/registrace.json
          git commit -m "Data z výpisu RSV k $den"
          git push origin "$vetev"
          {
            echo "Nový výpis z Registru silničních vozidel ke dni $den."
            echo
            echo "Před sloučením zkontroluj náhled webu (odkaz přidá Cloudflare do komentáře) a výstup reportu:"
            echo
            echo '```'
            cat report.txt
            echo '```'
            echo
            echo "XLSX report je v artefaktech běhu: $BEH"
          } > telo.md
          gh pr create --base main --head "$vetev" --title "Data z výpisu RSV k $den" --body-file telo.md
